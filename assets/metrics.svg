<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 210" role="img">
  <title>Production metrics dashboard</title>
  <rect width="1100" height="210" rx="18" fill="#07080d"/>
  <rect x="1" y="1" width="1098" height="208" rx="17" fill="none" stroke="#1c2433"/>
  <text x="28" y="32" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">LIVE SYSTEMS / PRODUCTION SIGNAL</text>
  <text x="900" y="32" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7ee2b8">STATUS NOMINAL</text>
  <g transform="translate(24,52)">
    <rect width="250" height="132" rx="14" fill="#0e1118" stroke="#1c2433"/>
    <text x="22" y="36" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">COMMS PLATFORM</text>
    <text x="22" y="82" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#5ce1e6">10M+</text>
    <text x="22" y="110" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e8edf5">messages / day</text>
    <rect x="22" y="120" width="180" height="3" rx="2" fill="#1c2433"/>
    <rect x="22" y="120" width="150" height="3" rx="2" fill="#5ce1e6"/>
  </g>
  <g transform="translate(290,52)">
    <rect width="250" height="132" rx="14" fill="#0e1118" stroke="#1c2433"/>
    <text x="22" y="36" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">KYC / LOAN APIS</text>
    <text x="22" y="82" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#a78bfa">27M</text>
    <text x="22" y="110" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e8edf5">daily transactions</text>
    <rect x="22" y="120" width="180" height="3" rx="2" fill="#1c2433"/>
    <rect x="22" y="120" width="168" height="3" rx="2" fill="#a78bfa"/>
  </g>
  <g transform="translate(556,52)">
    <rect width="250" height="132" rx="14" fill="#0e1118" stroke="#1c2433"/>
    <text x="22" y="36" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">HOLDINGS LATENCY</text>
    <text x="22" y="82" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f5c16c">350ms</text>
    <text x="22" y="110" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e8edf5">from 2.8s / DynamoDB</text>
    <rect x="22" y="120" width="180" height="3" rx="2" fill="#1c2433"/>
    <rect x="22" y="120" width="120" height="3" rx="2" fill="#f5c16c"/>
  </g>
  <g transform="translate(822,52)">
    <rect width="254" height="132" rx="14" fill="#0e1118" stroke="#1c2433"/>
    <text x="22" y="36" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">CONNECT TELEMETRY</text>
    <text x="22" y="82" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#7ee2b8">24h to min</text>
    <text x="22" y="110" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e8edf5">Spark / Iceberg stream</text>
    <rect x="22" y="120" width="180" height="3" rx="2" fill="#1c2433"/>
    <rect x="22" y="120" width="176" height="3" rx="2" fill="#5ce1e6"/>
